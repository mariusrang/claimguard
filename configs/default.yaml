# Main config: the full neural pipeline on SciFact.
# Needs the models (downloaded from the Hugging Face hub the first time).
seed: 13

data:
  dir: data/processed/scifact

retrieval:
  kind: hybrid            # bm25 | dense | hybrid | none
  depth: 50               # how many documents the first stage sends to the reranker
  rrf_k: 60               # constant of Reciprocal Rank Fusion
  cache_dir: data/processed/cache
  bm25: {k1: 1.5, b: 0.75}
  dense:
    model: BAAI/bge-small-en-v1.5
    pooling: cls
    query_prefix: "Represent this sentence for searching relevant passages: "

rerank:
  kind: cross_encoder     # cross_encoder | lexical | none
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_k: 5                # documents kept as evidence
  n_sentences: 3          # sentences kept per document

verifier:
  kind: nli               # nli | lexical | llm
  model: models/verifier  # my fine-tuned checkpoint (made by scripts/train_verifier.py)
  fallback_model: MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli   # used until I have trained mine
  max_length: 384
  batch_size: 32

aggregation: noisy_or     # majority | max_conf | noisy_or

calibration:
  temperature: 1.0
  threshold: 0.0
  file: models/calibration.json   # written by `scripts/evaluate.py calibration`

audit:
  path: logs/audit.jsonl
